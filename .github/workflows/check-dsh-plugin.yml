name: Check DSH Plugin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-sdk:
    name: SDK preparation (${{ matrix.dsh }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '24.9.0'
            dsh: '0.2.2-rc.1'
          - node: '24.22.2'
            dsh: '0.2.1-rc.5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Diagnose fresh SDK installation only
        run: node plugins/dsh/scripts/diagnose-sdk.mjs --dsh-version '${{ matrix.dsh }}'
      - name: Upload allowlisted SDK diagnostic summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-npm-diagnostic-${{ matrix.dsh }}-node-${{ matrix.node }}
          path: sdk-diagnostic-summary.json
          if-no-files-found: warn
          retention-days: 7
