name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/skillhub/**'
      - 'weekly/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/skillhub/package-lock.json
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: cd docs/skillhub && npm ci
      - name: Build and validate weekly reports
        run: |
          cd weekly
          python3 scripts/build_site.py
          python3 scripts/validate_site.py _site
      - name: Build with VitePress
        run: cd docs/skillhub && npm run build
      - name: Add weekly reports to Pages artifact
        run: |
          mkdir -p docs/skillhub/.vitepress/dist/weekly
          cp -R weekly/_site/. docs/skillhub/.vitepress/dist/weekly/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/skillhub/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
