# Production forwarding template; configure a durable downstream outside this repo.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 64
    spike_limit_mib: 16
exporters:
  otlphttp:
    endpoint: ${env:SKILLHUB_BUSINESS_LOGS_DOWNSTREAM_ENDPOINT}
    headers: ${env:SKILLHUB_BUSINESS_LOGS_DOWNSTREAM_HEADERS}
service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlphttp]
