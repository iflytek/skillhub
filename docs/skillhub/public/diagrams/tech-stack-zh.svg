<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc"><title id="title">SkillHub 技术栈</title>
<desc id="desc">四层技术组成：前端、后端、数据库与缓存、可配置的技能文件存储。</desc>
<rect width="1080" height="650" fill="#fff"/>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#202124}.title{font-size:25px;font-weight:600}.head{font-size:19px;font-weight:600}.body{font-size:22px}.note{font-size:17px;fill:#4b5563}</style>
<text x="36" y="43" class="title">SkillHub 技术栈</text>
<rect x="36" y="99" width="1008" height="105" rx="15" fill="#fff" stroke="#222" stroke-width="1.7"/>
<rect x="52" y="86" width="290" height="34" rx="10" fill="#5c83ef"/>
<text x="68" y="109" class="head">前端</text>
<text x="60" y="154" class="body">React · Vite · Tailwind CSS</text>
<text x="60" y="182" class="note">TanStack Router · TanStack Query</text>
<rect x="36" y="229" width="1008" height="105" rx="15" fill="#fff" stroke="#222" stroke-width="1.7"/>
<rect x="52" y="216" width="290" height="34" rx="10" fill="#5c83ef"/>
<text x="68" y="239" class="head">后端</text>
<text x="60" y="284" class="body">Java 21 · Spring Boot</text>
<text x="60" y="312" class="note">REST API</text>
<rect x="36" y="359" width="1008" height="105" rx="15" fill="#fff" stroke="#222" stroke-width="1.7"/>
<rect x="52" y="346" width="290" height="34" rx="10" fill="#5c83ef"/>
<text x="68" y="369" class="head">数据库与缓存</text>
<text x="60" y="414" class="body">PostgreSQL · Redis</text>
<text x="60" y="442" class="note">持久化与会话管理</text>
<rect x="36" y="489" width="1008" height="105" rx="15" fill="#fff" stroke="#222" stroke-width="1.7"/>
<rect x="52" y="476" width="290" height="34" rx="10" fill="#5c83ef"/>
<text x="68" y="499" class="head">技能文件存储</text>
<text x="60" y="544" class="body">本地文件 / S3 兼容存储</text>
<text x="60" y="572" class="note">在部署配置中选择存储后端</text>
<text x="36" y="626" class="note">图示为技术组成，不表示执行顺序；具体版本以仓库依赖清单为准。</text></svg>
