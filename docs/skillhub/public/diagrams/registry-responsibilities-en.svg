<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc">
<title id="title">Responsibilities in skill distribution</title>
<desc id="desc">Authors submit skill packages; the registry manages versions, access and governance; the target Agent environment loads and executes installed skills.</desc>
<rect x="1" y="1" width="358" height="318" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#475569" stroke-width="1.4"/></marker></defs>
<rect x="18" y="18" width="324" height="74" rx="8" fill="#ffffff" stroke="#64748b"/>
<text x="32" y="42" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#0f172a">1  Skill author</text>
<text x="32" y="64" font-family="system-ui,sans-serif" font-size="15" fill="#334155">Supplies SKILL.md and package files</text>
<text x="32" y="82" font-family="system-ui,sans-serif" font-size="15" fill="#334155">Describes purpose and dependencies</text>
<path d="M180 96 V112" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="18" y="118" width="324" height="74" rx="8" fill="#ffffff" stroke="#64748b"/>
<text x="32" y="142" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#0f172a">2  SkillHub registry</text>
<text x="32" y="164" font-family="system-ui,sans-serif" font-size="15" fill="#334155">Manages versions, access and review</text>
<text x="32" y="182" font-family="system-ui,sans-serif" font-size="15" fill="#334155">Provides search and file distribution</text>
<path d="M180 196 V212" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="18" y="218" width="324" height="74" rx="8" fill="#ffffff" stroke="#64748b"/>
<text x="32" y="242" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#0f172a">3  Target Agent environment</text>
<text x="32" y="264" font-family="system-ui,sans-serif" font-size="15" fill="#334155">CLI installs; Agent loads the skill</text>
<text x="32" y="282" font-family="system-ui,sans-serif" font-size="15" fill="#334155">Configures tools; assesses execution</text>
</svg>
