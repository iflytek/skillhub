<svg width="360" height="579" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 579" role="img" aria-labelledby="title desc">
<title id="title">Review Decision</title>
<desc id="desc">Identify the current request, verify evidence and readiness, decide only with permission, then re-read the result. Missing evidence leads to diagnosis, not approval.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#52657a"/></marker></defs>
<rect x="1" y="1" width="358" height="577" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="180" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172b4d">Review Decision</text>
<rect x="20" y="58" width="320" height="84" rx="10" fill="#fff" stroke="#b6c7dc"/>
<text x="36" y="83" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#174a7c">1. Identify current request</text>
<text x="36" y="106" font-family="Arial,sans-serif" font-size="14" fill="#334155">Subject, submitter, version, visibility</text>
<text x="36" y="126" font-family="Arial,sans-serif" font-size="14" fill="#334155">Check namespace and review permission</text>
<path d="M180 145V158" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="162" width="320" height="84" rx="10" fill="#fff" stroke="#b6c7dc"/>
<text x="36" y="187" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#174a7c">2. Inspect evidence</text>
<text x="36" y="210" font-family="Arial,sans-serif" font-size="14" fill="#334155">Files, changes, scan and metadata</text>
<text x="36" y="230" font-family="Arial,sans-serif" font-size="14" fill="#334155">Missing evidence: diagnose or wait</text>
<path d="M180 249V262" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="266" width="320" height="84" rx="10" fill="#fff" stroke="#b6c7dc"/>
<text x="36" y="291" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#174a7c">3. Submit a decision</text>
<text x="36" y="314" font-family="Arial,sans-serif" font-size="14" fill="#334155">Pending task and eligible reviewer</text>
<text x="36" y="334" font-family="Arial,sans-serif" font-size="14" fill="#334155">Approve, or reject with correction details</text>
<path d="M180 353V366" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="370" width="320" height="84" rx="10" fill="#fff" stroke="#b6c7dc"/>
<text x="36" y="395" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#174a7c">4. Re-read the outcome</text>
<text x="36" y="418" font-family="Arial,sans-serif" font-size="14" fill="#334155">Check task plus target object state</text>
<text x="36" y="438" font-family="Arial,sans-serif" font-size="14" fill="#334155">Approval is not Agent execution proof</text>
<text x="180" y="533" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Use the current submission, not the old release.</text>
<text x="180" y="554" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Do not repeat a decision after a conflict.</text>
</svg>
