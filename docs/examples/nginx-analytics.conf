# OPTIONAL deployment-owned edge example. Not included by SkillHub.
# HTTP here is a loopback leg behind the operator's existing HTTPS terminator.
# Merge existing TLS, CSP, authentication, host validation and security headers;
# do not expose this listener publicly or replace the production server wholesale.
upstream skillhub_analytics_web {
    server 127.0.0.1:8080;
}
server {
    listen 127.0.0.1:8081;
    server_name localhost;

    # Exact file only: a missing collector must be 404, never SPA HTML.
    location = /_skillhub-observe/skillhub-observer.v1.mjs {
        alias /srv/skillhub-observe/skillhub-observer.v1.mjs;
        types { }
        default_type application/javascript;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /_skillhub-observe/ { return 404; }

    # No filtering or cache-policy changes for API, auth, assets, runtime config,
    # registry guides/downloads or health. Preserve original URI (no trailing /).
    location ~ ^/(api/|oauth2/|login/oauth2/|\.well-known/|assets/|registry/|runtime-config\.js$|nginx-health) {
        proxy_pass http://skillhub_analytics_web;
        proxy_set_header Host $http_host;
    }

    # Only the UI fallback is eligible; sub_filter's default MIME is text/html.
    location / {
        proxy_pass http://skillhub_analytics_web;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_cache off;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_hide_header Content-MD5;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store" always;
        sub_filter_once on;
        sub_filter_last_modified off;
        sub_filter '</head>' '<script type="module" src="/_skillhub-observe/skillhub-observer.v1.mjs"></script></head>';
    }
}
