# OPTIONAL deployment-owned edge template. Not included by SkillHub.
# Demo HTTP listener: publish on loopback only, behind your existing HTTPS edge.
# Substitute only SKILLHUB_WEB_UPSTREAM and UMAMI_UPSTREAM (host:port).
# Merge existing TLS, CSP, authentication, host validation and security headers.
upstream skillhub_analytics_web { server ${SKILLHUB_WEB_UPSTREAM}; }
upstream skillhub_analytics_umami { server ${UMAMI_UPSTREAM}; }
server {
    listen 8081;
    server_name localhost;

    # Install ONLY the three .mjs files here, not declarations or other files.
    # A single versioned prefix serves the entry AND its relative imports.
    location ^~ /_skillhub-observe/v1/ {
        root /srv;
        try_files $uri =404;
        error_page 404 = @module_missing;
        autoindex off;
        types { application/javascript mjs; }
        default_type application/javascript;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location @module_missing {
        default_type application/javascript;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        return 404 '// module not found\n';
    }
    location /_skillhub-observe/ { return 404; }

    # Expose only two collector endpoints, NEVER Umami's dashboard/admin API.
    location = /_skillhub-umami/script.js {
        limit_except GET { deny all; }
        proxy_pass http://skillhub_analytics_umami/script.js;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "";
        proxy_hide_header Set-Cookie;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /_skillhub-umami/api/send {
        limit_except POST { deny all; }
        proxy_pass http://skillhub_analytics_umami/api/send;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "";
        proxy_hide_header Set-Cookie;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
    location /_skillhub-umami/ { return 404; }

    # No filtering or cache-policy changes for API, auth, assets, runtime config,
    # registry guides/downloads or health. Preserve original URI (no trailing /).
    location ~ ^/(api/|oauth2/|login/oauth2/|\.well-known/|assets/|registry/|runtime-config\.js$|nginx-health) {
        proxy_pass http://skillhub_analytics_web;
        proxy_set_header Host $http_host;
    }

    # Only UI HTML is eligible; sub_filter's default MIME is text/html.
    location / {
        proxy_pass http://skillhub_analytics_web;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_cache off;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_hide_header Content-MD5;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store" always;
        # Also prevent the browser's HTTP Referer from leaking page paths/queries.
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy "no-referrer" always;
        sub_filter_once on;
        sub_filter_last_modified off;
        sub_filter '</head>' '<script type="module" src="/_skillhub-observe/v1/observer.mjs"></script></head>';
    }
}
