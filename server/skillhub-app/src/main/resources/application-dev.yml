spring:
  datasource:
    url: ${DEV_DATASOURCE_URL:jdbc:mysql://localhost:3306/skillhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DEV_DATASOURCE_USERNAME:skillhub}
    password: ${DEV_DATASOURCE_PASSWORD:skillhub_dev}
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:sql/migration-mysql

skillhub:
  runtime:
    state:
      provider: memory
  public:
    base-url: http://localhost:3000
  storage:
    provider: local
    local:
      base-path: ${DEV_STORAGE_BASE_PATH:${user.home}/.skillhub/dev/storage}
  search:
    engine: mysql
    provider: mysql-like
    local-file-index:
      directory: ${SKILLHUB_SEARCH_LOCAL_FILE_INDEX_DIRECTORY:${user.home}/.skillhub/dev/search-index}
  auth:
    mock:
      enabled: true
    uass:
      enabled: false
      base-url: mock://self
      client-id: your-client-id
      client-secret: your-client-secret
      callback-path: /api/v1/auth/uass/callback
      mock-login-base-url: ${SKILLHUB_AUTH_UASS_MOCK_LOGIN_BASE_URL:http://localhost:3001}
      admin-users:
        - ussId: uass-admin-003
    device:
      enabled: false
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
  security:
    scanner:
      enabled: ${SKILLHUB_SECURITY_SCANNER_ENABLED:false}

logging:
  level:
    com.iflytek.skillhub: INFO
    org.springframework.security: WARN
