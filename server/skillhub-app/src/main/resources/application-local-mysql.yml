spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${LOCAL_MYSQL_DATASOURCE_URL:jdbc:mysql://localhost:3306/skillhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${LOCAL_MYSQL_DATASOURCE_USERNAME:skillhub}
    password: ${LOCAL_MYSQL_DATASOURCE_PASSWORD:skillhub_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

skillhub:
  public:
    base-url: http://localhost:3000
  storage:
    provider: local
    local:
      base-path: ${LOCAL_MYSQL_STORAGE_BASE_PATH:${user.home}/.skillhub/local-mysql/storage}
  ratelimit:
    mode: memory
  auth:
    mock:
      enabled: true
    uass:
      enabled: true
      # Use mock://self to verify the UASS browser flow locally without the
      # enterprise gateway implementation. Replace with the real UASS endpoint
      # after providing a custom UassGateway bean.
      base-url: mock://self
      client-id: your-client-id
      client-secret: your-client-secret
      callback-path: /api/v1/auth/uass/callback
      # Optional dedicated host for the local mock third-party authorization page.
      # Example: http://localhost:3001
      mock-login-base-url: ${SKILLHUB_AUTH_UASS_MOCK_LOGIN_BASE_URL:http://localhost:3001}
      cache-mode: local
      # Pre-register rollout administrators for first-time UASS sign-in.
      # Example:
      admin-users:
        - ussId: uass-admin-001
          roles:
            - USER_ADMIN
    device:
      enabled: false
    failure-throttle:
      mode: memory
  bootstrap:
    admin:
      enabled: true
  security:
    scanner:
      enabled: false

logging:
  level:
    com.iflytek.skillhub: INFO
    org.springframework.security: WARN
