spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/skillhub
    username: skillhub
    password: skillhub_dev
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${OAUTH2_GITHUB_CLIENT_ID:local-placeholder}
            client-secret: ${OAUTH2_GITHUB_CLIENT_SECRET:local-placeholder}

server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

skillhub:
  public:
    base-url: http://localhost:3000
  auth:
    mock:
      enabled: true
    uass:
      enabled: false
      # Use mock://self to verify the UASS browser flow locally without the
      # enterprise gateway implementation. Replace with the real UASS endpoint
      # after providing a custom UassGateway bean.
      base-url: mock://self
      client-id: your-client-id
      client-secret: your-client-secret
      callback-path: /api/v1/auth/uass/callback
    notification:
      cleanup:
        read-retention-days: 30
        unread-retention-days: 90
  runtime:
    state:
      # Override with SKILLHUB_RUNTIME_STATE_PROVIDER=memory to fall back to
      # in-process session/rate-limit/UASS state without changing app code.
      provider: ${SKILLHUB_RUNTIME_STATE_PROVIDER:redis}
  security:
    scanner:
      enabled: ${SKILLHUB_SECURITY_SCANNER_ENABLED:false}
    stream:
      reclaim-enabled: ${SKILLHUB_SCAN_STREAM_RECLAIM_ENABLED:true}
      reclaim-min-idle: ${SKILLHUB_SCAN_STREAM_RECLAIM_MIN_IDLE:PT2M}
      reclaim-batch-size: ${SKILLHUB_SCAN_STREAM_RECLAIM_BATCH_SIZE:20}
      reclaim-interval: ${SKILLHUB_SCAN_STREAM_RECLAIM_INTERVAL:PT30S}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
  profile:
    moderation:
      machine-review: ${SKILLHUB_PROFILE_MACHINE_REVIEW_ENABLED:true}
      human-review: ${SKILLHUB_PROFILE_HUMAN_REVIEW_ENABLED:true}

logging:
  level:
    com.iflytek.skillhub: INFO
    org.springframework.security: WARN
