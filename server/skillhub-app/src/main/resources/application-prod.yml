server:
  servlet:
    session:
      cookie:
        secure: true

spring:
  datasource:
    url: ${PROD_DATASOURCE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${PROD_DATASOURCE_USERNAME}
    password: ${PROD_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:sql/migration-mysql

skillhub:
  runtime:
    state:
      provider: redis
  public:
    base-url: ${SKILLHUB_PUBLIC_BASE_URL}
  search:
    engine: mysql
    provider: local-file-index
    local-file-index:
      directory: ${SKILLHUB_SEARCH_LOCAL_FILE_INDEX_DIRECTORY:/var/lib/skillhub/search-index}
    rebuild-on-startup: false
  auth:
    mock:
      enabled: false
  bootstrap:
    admin:
      enabled: false

logging:
  level:
    com.iflytek.skillhub: INFO
    org.springframework.security: WARN
